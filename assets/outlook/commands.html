<title>Imagina Signatures</title>
<!--
  Outlook add-in runtime of Imagina Signatures (manifest: Runtime
  "WebViewRuntime.Url" and FunctionFile "Commands.Url").

  Office.js is loaded from Microsoft's official CDN. This is the one
  documented exception to the plugin's "no external CDN" rule
  (CLAUDE.md §0.1): Office requires add-ins to reference the hosted
  library and it cannot be bundled. Nothing else is loaded from outside
  this site.

  The deployment key and the signature endpoint arrive in this page's
  query string (?key=…&api=…) and are read by launchevent.js.
-->
<script data-cfasync="false" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script data-cfasync="false" src="launchevent.js"></script>
</head>
