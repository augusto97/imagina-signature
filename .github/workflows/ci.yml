name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Coding standards run once: PHPCS output doesn't depend on the PHP
  # runtime (PHPCompatibilityWP checks the 7.4+ target via testVersion),
  # so repeating it across the matrix only multiplies the noise.
  phpcs:
    name: PHPCS (WPCS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, openssl
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-phpcs-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-phpcs-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # Errors fail the job (non-zero exit); warnings are reported but
      # don't block (`ignore_warnings_on_exit` in phpcs.xml.dist, also
      # passed explicitly here so a local ruleset override can't
      # silently turn errors into a pass).
      - name: Lint (PHPCS / WPCS)
        run: vendor/bin/phpcs -q --report-full --report-summary --runtime-set ignore_warnings_on_exit 1 --runtime-set ignore_errors_on_exit 0

  php:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, openssl
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php }}-

      # composer.json pins `config.platform.php = 7.4.0`, so the lock
      # resolves to packages installable on every matrix entry.
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Test (PHPUnit)
        run: vendor/bin/phpunit

  js:
    name: JavaScript / TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # package-lock.json is committed — install exactly what it pins.
      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Test (Vitest)
        run: npm test

      # Every msgid must be translated before a release (Spanish is the
      # primary audience). Refresh with: npm run i18n:pot && npm run i18n:update.
      - name: Translations complete
        run: npm run i18n:check

      - name: Build (Vite)
        run: npm run build
